<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="24" fill="#10223b"/><text x="65" y="78" font-family="Arial" font-size="19" fill="#5de0cc" letter-spacing="4">04 / UNIVERSITY WEB PROJECT</text><text x="65" y="155" font-family="Arial" font-size="60" font-weight="bold" fill="white">Smart Task</text><text x="65" y="202" font-family="Arial" font-size="24" fill="#bacce1">Plan your day. Choose priorities. Track progress.</text><g font-family="Arial"><rect x="65" y="265" width="330" height="165" rx="14" fill="#1d3553"/><text x="90" y="312" fill="#5de0cc" font-size="18">01 / CAPTURE</text><text x="90" y="355" fill="white" font-size="27">Add a task</text><text x="90" y="391" fill="#bacce1" font-size="17">Record the goal and details</text><rect x="435" y="265" width="330" height="165" rx="14" fill="#1d3553"/><text x="460" y="312" fill="#5de0cc" font-size="18">02 / ORGANIZE</text><text x="460" y="355" fill="white" font-size="27">Set a priority</text><text x="460" y="391" fill="#bacce1" font-size="17">Choose what matters first</text><rect x="805" y="265" width="330" height="165" rx="14" fill="#1d3553"/><text x="830" y="312" fill="#5de0cc" font-size="18">03 / COMPLETE</text><text x="830" y="355" fill="white" font-size="27">Track progress</text><text x="830" y="391" fill="#bacce1" font-size="17">Update, finish, or remove tasks</text><text x="65" y="492" fill="#bacce1" font-size="17">HTML / CSS / JavaScript / localStorage</text><text x="850" y="492" fill="#bacce1" font-size="15">FEATURE OVERVIEW</text></g></svg>